<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis Clients | Adventure Treks avec Ali</title>
    <meta name="description" content="Découvrez les avis et témoignages des voyageurs qui ont vécu l'expérience Adventure Treks avec Ali.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
        }
        
        /* Cartes */
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .card h3 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
            font-size: 1.4rem;
        }
        
        /* Formulaires */
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #e67e22;
        }
        
        button {
            background: #e67e22;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        
        button:hover {
            background: #d35400;
            transform: translateY(-2px);
        }
        
        .btn-google {
            background: #4285F4;
            margin-top: 10px;
        }
        
        .btn-google:hover {
            background: #3367D6;
        }
        
        .btn-logout {
            background: #e74c3c;
            width: auto;
            padding: 8px 20px;
        }
        
        .btn-logout:hover {
            background: #c0392b;
        }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            flex: 1;
            background: transparent;
            border: 2px solid #e67e22;
            color: #e67e22;
        }
        
        .tab-btn.active {
            background: #e67e22;
            color: white;
        }
        
        /* Étoiles */
        .star-rating {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }
        
        .star-rating span {
            font-size: 40px;
            cursor: pointer;
            color: #ddd;
            transition: all 0.2s;
        }
        
        .star-rating span.selected,
        .star-rating span:hover {
            color: #FFD700;
            transform: scale(1.1);
        }
        
        /* Avis */
        .review-card {
            background: #f9f9f9;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #e67e22;
            transition: all 0.3s;
        }
        
        .review-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .review-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        
        .review-stars {
            color: #FFD700;
            font-size: 16px;
        }
        
        .review-text {
            color: #444;
            line-height: 1.6;
            margin: 12px 0;
        }
        
        .review-date {
            font-size: 11px;
            color: #999;
            margin-top: 8px;
        }
        
        .delete-btn {
            background: #e74c3c;
            padding: 6px 15px;
            width: auto;
            font-size: 13px;
            margin-top: 10px;
        }
        
        .delete-btn:hover {
            background: #c0392b;
        }
        
        .user-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .welcome-text {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .small-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        
        .empty-reviews {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        
        .empty-reviews i {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
            color: #ddd;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e67e22;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }
            
            .star-rating span {
                font-size: 30px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⭐ Avis des Voyageurs</h1>
        <p class="subtitle">Découvrez ce que nos clients disent de leur expérience avec Ali</p>
        
        <!-- SECTION AUTHENTIFICATION -->
        <div class="card" id="authCard">
            <!-- Formulaire de connexion -->
            <div id="loginForm">
                <h3>🔐 Connectez-vous pour laisser un avis</h3>
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="showTab('email')" id="emailTabBtn">📧 Email</button>
                    <button class="tab-btn" onclick="showTab('google')" id="googleTabBtn">🔵 Google</button>
                </div>
                
                <!-- Onglet Email -->
                <div id="emailTab">
                    <div class="form-group">
                        <label>👤 Nom complet</label>
                        <input type="text" id="userName" placeholder="Votre nom">
                    </div>
                    <div class="form-group">
                        <label>📧 Email</label>
                        <input type="email" id="userEmail" placeholder="votre@email.com">
                    </div>
                    <div class="form-group">
                        <label>🔒 Mot de passe (min. 6 caractères)</label>
                        <input type="password" id="userPassword" placeholder="Mot de passe">
                    </div>
                    <button onclick="signUpWithEmail()">📝 Créer un compte / Se connecter</button>
                </div>
                
                <!-- Onglet Google -->
                <div id="googleTab" style="display: none;">
                    <p style="text-align: center; margin-bottom: 20px; color: #666;">
                        Connectez-vous instantanément avec votre compte Google
                    </p>
                    <button onclick="signInWithGoogle()" class="btn-google">
                        <i class="fab fa-google"></i> Se connecter avec Google
                    </button>
                </div>
            </div>
            
            <!-- Infos utilisateur connecté -->
            <div id="userInfo" style="display: none;">
                <div class="user-info-bar">
                    <div class="welcome-text">
                        <div class="small-avatar" id="userAvatarInitial">U</div>
                        <div>
                            <strong id="displayUserName">Utilisateur</strong>
                            <div style="font-size: 12px; color: #27ae60;">Connecté ✅</div>
                        </div>
                    </div>
                    <button onclick="signOut()" class="btn-logout">
                        <i class="fas fa-sign-out-alt"></i> Déconnexion
                    </button>
                </div>
            </div>
        </div>
        
        <!-- FORMULAIRE D'AVIS -->
        <div class="card" id="reviewFormCard" style="display: none;">
            <h3>✍️ Laissez votre avis</h3>
            <div class="star-rating" id="starRating">
                <span data-value="1">★</span>
                <span data-value="2">★</span>
                <span data-value="3">★</span>
                <span data-value="4">★</span>
                <span data-value="5">★</span>
            </div>
            <input type="hidden" id="selectedRating" value="0">
            <div class="form-group">
                <textarea id="reviewText" rows="4" placeholder="Partagez votre expérience avec Ali... (minimum 10 caractères)"></textarea>
            </div>
            <button onclick="submitReview()">
                <i class="fas fa-paper-plane"></i> Publier mon avis
            </button>
        </div>
        
        <!-- LISTE DES AVIS -->
        <div class="card">
            <h3>📖 Témoignages de nos voyageurs</h3>
            <div id="reviewsList">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px;">Chargement des avis...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ============================================
        // 🔥 DONNÉES FIREBASE (VOUS LES AVEZ FOURNIES)
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBjVLmLwuzyTW_Rf3HKlrQ4eTZPx8nQXAk",
            authDomain: "trek-maroc-reviews.firebaseapp.com",
            projectId: "trek-maroc-reviews",
            storageBucket: "trek-maroc-reviews.firebasestorage.app",
            messagingSenderId: "1088181638129",
            appId: "1:1088181638129:web:8dbb3bd170fc1d811daa50",
            measurementId: "G-DFHEXBTXLF"
        };
        
        // Initialisation Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let currentUser = null;
        let selectedRating = 0;
        
        // 📢 Notification
        function showToast(message, type = "success") {
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.style.background = type === "error" ? "#e74c3c" : "#27ae60";
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // 🔄 Changer d'onglet (Email/Google)
        function showTab(tab) {
            const emailTab = document.getElementById("emailTab");
            const googleTab = document.getElementById("googleTab");
            const emailBtn = document.getElementById("emailTabBtn");
            const googleBtn = document.getElementById("googleTabBtn");
            
            if (tab === "email") {
                emailTab.style.display = "block";
                googleTab.style.display = "none";
                emailBtn.classList.add("active");
                googleBtn.classList.remove("active");
            } else {
                emailTab.style.display = "none";
                googleTab.style.display = "block";
                googleBtn.classList.add("active");
                emailBtn.classList.remove("active");
            }
        }
        
        // 📧 Inscription / Connexion par Email
        async function signUpWithEmail() {
            const name = document.getElementById("userName").value.trim();
            const email = document.getElementById("userEmail").value.trim();
            const password = document.getElementById("userPassword").value;
            
            if (!name || !email || !password) {
                showToast("Veuillez remplir tous les champs", "error");
                return;
            }
            
            if (password.length < 6) {
                showToast("Le mot de passe doit contenir au moins 6 caractères", "error");
                return;
            }
            
            try {
                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    await userCredential.user.updateProfile({ displayName: name });
                    showToast("✅ Compte créé avec succès !");
                } catch (error) {
                    if (error.code === "auth/email-already-in-use") {
                        await auth.signInWithEmailAndPassword(email, password);
                        showToast("✅ Connecté avec succès !");
                    } else {
                        throw error;
                    }
                }
            } catch (error) {
                console.error(error);
                let message = "Erreur de connexion";
                if (error.code === "auth/wrong-password") message = "Mot de passe incorrect";
                if (error.code === "auth/invalid-email") message = "Email invalide";
                if (error.code === "auth/weak-password") message = "Mot de passe trop faible";
                showToast(message, "error");
            }
        }
        
        // 🔵 Connexion avec Google
        async function signInWithGoogle() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                await auth.signInWithPopup(provider);
                showToast("✅ Connecté avec Google !");
            } catch (error) {
                console.error(error);
                showToast("Erreur de connexion Google", "error");
            }
        }
        
        // 🚪 Déconnexion
        async function signOut() {
            try {
                await auth.signOut();
                showToast("Déconnecté");
            } catch (error) {
                showToast("Erreur lors de la déconnexion", "error");
            }
        }
        
        // 👤 Mettre à jour l'interface
        function updateAuthUI(user) {
            currentUser = user;
            const loginForm = document.getElementById("loginForm");
            const userInfo = document.getElementById("userInfo");
            const reviewFormCard = document.getElementById("reviewFormCard");
            
            if (user) {
                loginForm.style.display = "none";
                userInfo.style.display = "block";
                reviewFormCard.style.display = "block";
                
                const displayName = user.displayName || user.email.split("@")[0];
                document.getElementById("displayUserName").textContent = displayName;
                document.getElementById("userAvatarInitial").textContent = displayName.charAt(0).toUpperCase();
            } else {
                loginForm.style.display = "block";
                userInfo.style.display = "none";
                reviewFormCard.style.display = "none";
            }
        }
        
        // ⭐ Système d'étoiles
        function initStarRating() {
            const stars = document.querySelectorAll("#starRating span");
            stars.forEach(star => {
                star.addEventListener("click", function() {
                    selectedRating = parseInt(this.dataset.value);
                    document.getElementById("selectedRating").value = selectedRating;
                    stars.forEach(s => s.classList.remove("selected"));
                    stars.forEach(s => {
                        if (parseInt(s.dataset.value) <= selectedRating) {
                            s.classList.add("selected");
                        }
                    });
                });
            });
        }
        
        // 📝 Publier un avis
        async function submitReview() {
            if (!currentUser) {
                showToast("Veuillez vous connecter d'abord", "error");
                return;
            }
            
            if (selectedRating === 0) {
                showToast("Veuillez sélectionner une note", "error");
                return;
            }
            
            const text = document.getElementById("reviewText").value.trim();
            if (!text || text.length < 10) {
                showToast("Veuillez écrire un avis plus détaillé (minimum 10 caractères)", "error");
                return;
            }
            
            try {
                await db.collection("comments").add({
                    authorName: currentUser.displayName || currentUser.email.split("@")[0],
                    authorEmail: currentUser.email,
                    userId: currentUser.uid,
                    rating: selectedRating,
                    text: text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                document.getElementById("reviewText").value = "";
                selectedRating = 0;
                document.getElementById("selectedRating").value = "0";
                document.querySelectorAll("#starRating span").forEach(s => s.classList.remove("selected"));
                
                showToast("✅ Merci pour votre avis !");
                loadReviews();
            } catch (error) {
                console.error(error);
                showToast("Erreur lors de la publication", "error");
            }
        }
        
        // 📋 Charger les avis
        async function loadReviews() {
            const container = document.getElementById("reviewsList");
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Chargement...</p></div>';
            
            try {
                const snapshot = await db.collection("comments")
                    .orderBy("createdAt", "desc")
                    .limit(50)
                    .get();
                
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-reviews">
                            <i class="fas fa-star-half-alt"></i>
                            <p>Soyez le premier à laisser un avis sur Ali !</p>
                        </div>
                    `;
                    return;
                }
                
                let html = "";
                snapshot.forEach(doc => {
                    const review = doc.data();
                    const reviewId = doc.id;
                    const isOwner = currentUser && review.userId === currentUser.uid;
                    
                    let date = "Récemment";
                    if (review.createdAt) {
                        try {
                            const d = review.createdAt.toDate();
                            date = d.toLocaleDateString("fr-FR", {
                                day: "numeric", month: "long", year: "numeric"
                            });
                        } catch(e) {}
                    }
                    
                    let starsHtml = "";
                    for (let i = 1; i <= 5; i++) {
                        starsHtml += i <= review.rating ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
                    }
                    
                    html += `
                        <div class="review-card">
                            <div class="review-header">
                                <div class="review-author">
                                    <div class="avatar">${escapeHtml((review.authorName || "A").charAt(0).toUpperCase())}</div>
                                    <div>
                                        <strong>${escapeHtml(review.authorName || "Anonyme")}</strong>
                                        <div class="review-date">${date}</div>
                                    </div>
                                </div>
                                <div class="review-stars">${starsHtml}</div>
                            </div>
                            <p class="review-text">${escapeHtml(review.text)}</p>
                            ${isOwner ? `
                                <button onclick="deleteReview('${reviewId}')" class="delete-btn">
                                    <i class="fas fa-trash"></i> Supprimer mon avis
                                </button>
                            ` : ''}
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="empty-reviews">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Erreur de connexion à la base de données</p>
                        <button onclick="loadReviews()" style="width: auto; margin-top: 15px;">🔄 Réessayer</button>
                    </div>
                `;
            }
        }
        
        // 🗑️ Supprimer un avis
        async function deleteReview(reviewId) {
            if (!confirm("Voulez-vous vraiment supprimer cet avis ?")) return;
            
            try {
                await db.collection("comments").doc(reviewId).delete();
                showToast("✅ Avis supprimé !");
                loadReviews();
            } catch (error) {
                console.error(error);
                showToast("Erreur lors de la suppression", "error");
            }
        }
        
        // 🛡️ Protection XSS
        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 👂 Écouter les changements d'authentification
        auth.onAuthStateChanged((user) => {
            updateAuthUI(user);
            loadReviews();
        });
        
        // 🚀 Initialisation
        document.addEventListener("DOMContentLoaded", () => {
            initStarRating();
        });
        
        // Exposer les fonctions
        window.showTab = showTab;
        window.signUpWithEmail = signUpWithEmail;
        window.signInWithGoogle = signInWithGoogle;
        window.signOut = signOut;
        window.submitReview = submitReview;
        window.deleteReview = deleteReview;
    </script>
</body>
</html>
